name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
# Never run two releases at once (they would compute the same next tag).
# Queued runs are not cancelled; the newest pending run covers every commit
# since the last tag anyway.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  # Reuse the test workflow: the release job only starts when it succeeded.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  release:
    needs: test
    # A manual run from another branch must never tag.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.new_tag || steps.head.outputs.tag }}
      # 'true' only when this run pushed a new tag; a re-run on an already
      # tagged HEAD republishes that version but must not move latest.
      created: ${{ steps.tag.outputs.new_tag != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # default_bump patch would otherwise tag a commit that is already
      # released (e.g. a manual re-run), so skip when HEAD carries a tag.
      - name: Check whether HEAD is already tagged
        id: head
        run: |
          if tag="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "HEAD is already released as $tag, nothing to do."
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute and push the next tag
        id: tag
        if: steps.head.outputs.tagged == 'false'
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
          default_bump: patch
          release_branches: main
          custom_release_rules: >-
            feat:minor:Features,fix:patch:Bug Fixes,perf:patch:Performance,revert:patch:Reverts,refactor:patch:Refactoring,docs:patch:Documentation,chore:patch:Chores,ci:patch:CI,test:patch:Tests,build:patch:Build
      # Also recovers a tag whose release creation failed on an earlier run.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag || steps.head.outputs.tag }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          if [ -z "$NEW_TAG" ]; then
            echo "No tag, nothing to release."
            exit 0
          fi
          if gh release view "$NEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $NEW_TAG already exists."
            exit 0
          fi
          if [ -n "$CHANGELOG" ]; then
            # GitHub caps release notes at ~125k characters.
            printf '%s\n' "$CHANGELOG" | head -c 100000 |
              gh release create "$NEW_TAG" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --title "$NEW_TAG" --notes-file -
          else
            gh release create "$NEW_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$NEW_TAG" --generate-notes
          fi
  # Builds from the release tag, so a re-run on an already tagged HEAD
  # republishes the image for that tag.
  image:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    # The Dockerfile cross-compiles, so no QEMU is needed for arm64.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.release.outputs.created == 'true' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
