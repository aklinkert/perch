{{define "repo_health.html"}}
<div class="flex items-center justify-between mb-3">
  <h2 class="font-semibold">{{.Title}}</h2>
  <span class="text-xs text-gray-500">{{.Updated}}</span>
</div>
{{if .Error}}
<div class="text-sm text-red-400">error: {{.Error}}</div>
{{end}}
{{if not .Items}}
<div class="text-sm text-gray-500">no repos</div>
{{else}}
<ul class="space-y-2">
  {{range .Items}}
  <li class="flex items-center gap-2 text-sm">
    <a href="{{.URL}}" target="_blank" class="font-mono hover:underline flex-1 min-w-0 truncate">{{.Repo}}</a>
    <span class="inline-block px-2 py-0.5 rounded text-xs bg-blue-700 text-white">{{.OpenPRs}} PRs</span>
    <span class="inline-block px-2 py-0.5 rounded text-xs text-white {{if gt .FailingChecks 0}}bg-red-600{{else}}bg-gray-600{{end}}">{{.FailingChecks}} failing</span>
    <span class="inline-block px-2 py-0.5 rounded text-xs text-white {{if gt .StaleDays 30}}bg-yellow-700{{else}}bg-gray-600{{end}}">{{.StaleDays}}d stale</span>
  </li>
  {{end}}
</ul>
{{end}}
{{end}}
