{{define "layout.html"}}<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Perch</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/sse.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <header class="border-b border-gray-800 px-4 py-3 flex items-center justify-between">
    <h1 class="font-semibold text-lg">Perch</h1>
    <span class="text-xs text-gray-500" id="conn-status">connecting…</span>
  </header>

  <main hx-ext="sse" sse-connect="/events"
        class="gap-2 p-2 columns-1 md:columns-{{.Columns}}">
    {{range .Widgets}}
    <section id="widget-{{.ID}}"
             class="break-inside-avoid mb-2 rounded-lg border border-gray-800 bg-gray-900 p-3"
             sse-swap="widget-{{.ID}}"
             hx-swap="innerHTML">
      {{.InitialHTML}}
    </section>
    {{end}}
  </main>
</body>
</html>{{end}}
